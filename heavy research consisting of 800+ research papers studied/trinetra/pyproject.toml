[project]
name = "trinetra"
version = "0.1.0"
description = "TRINETRA/HIMKAVACH multi-hazard offline-first advisory early-warning system (research prototype)"
requires-python = ">=3.11"
# Core (available in this environment):
dependencies = ["numpy", "pandas", "lxml"]

# Optional heavy stack for the deep-learning components (NOT installed in this environment).
# Interfaces are implemented; concrete deep models require these and are stubbed otherwise.
[project.optional-dependencies]
deep = ["torch", "scikit-learn", "xgboost", "d3rlpy", "stable-baselines3"]
dev = ["pytest", "hypothesis"]

[tool.trinetra]
# Honesty/safety invariants surfaced for CI (see scripts/ci_gates.py)
no_perf_claims_before_gate = true   # R16
advisory_only = true                # R19
classC_default_off = true           # R20
